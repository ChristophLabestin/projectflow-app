<html lang="en" class="light">

<head>
    <meta charset="utf-8" />

    <title>ProjectFlow AI</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

    <script>
        // Polyfill process.env to prevent ReferenceError in libs that expect it
        window.process = window.process || {
            env: {}
        };
        window.process.env = {
            ...window.process.env,
            API_KEY: '',
            NODE_ENV: 'production'
        };
    </script>
