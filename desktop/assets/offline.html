<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>ProjectFlow</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: Canvas; color: CanvasText; }
  .drag { position: fixed; inset: 0 0 auto 0; height: 40px; -webkit-app-region: drag; }
  main { height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 auto 20px; max-width: 380px; opacity: .7; line-height: 1.5; }
  button { font: inherit; padding: 8px 18px; border-radius: 8px; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); background: transparent; color: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="drag"></div>
<main>
  <div>
    <h1 id="title"></h1>
    <p id="body"></p>
    <button id="retry" type="button"></button>
  </div>
</main>
<script>
  const params = new URLSearchParams(location.hash.slice(1) || location.search); // data: URL, see desktop/src/localPages.ts
  const target = params.get('url');
  document.getElementById('title').textContent = params.get('title') || 'ProjectFlow is offline';
  document.getElementById('body').textContent = params.get('body') || '';
  const retry = document.getElementById('retry');
  retry.textContent = params.get('retry') || 'Try again';
  const reconnect = () => { if (target && /^https?:/.test(target)) location.replace(target); };
  retry.addEventListener('click', reconnect);
  window.addEventListener('online', reconnect);
  setInterval(() => { if (navigator.onLine) reconnect(); }, 30000);
</script>
</body>
</html>
