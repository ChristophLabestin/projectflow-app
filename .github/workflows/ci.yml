name: CI

'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Theme lint
        run: npm run lint:theme
        working-directory: web
      - name: Unit tests
        run: npm run test:run
        working-directory: web
      - name: Type check
        run: npm run typecheck
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
        env:
          VITE_FIREBASE_API_KEY: '${{ secrets.VITE_FIREBASE_API_KEY }}'
          VITE_FIREBASE_AUTH_DOMAIN: '${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}'
          VITE_FIREBASE_PROJECT_ID: '${{ secrets.VITE_FIREBASE_PROJECT_ID }}'
          VITE_FIREBASE_STORAGE_BUCKET: '${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}'
          VITE_FIREBASE_APP_ID: '${{ secrets.VITE_FIREBASE_APP_ID }}'
          VITE_FIREBASE_MEASUREMENT_ID: '${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}'
          VITE_SENTRY_DSN: '${{ secrets.VITE_SENTRY_DSN }}'

  functions:
    name: Functions (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install
        run: npm ci
        working-directory: functions
      - name: Lint
        run: npm run lint
        working-directory: functions
      - name: Build
        run: npm run build
        working-directory: functions

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
        working-directory: functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Rules tests
        run: npm run test:rules
        working-directory: functions

  smoke:
    name: Pre-deploy smoke (production build + emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install web
        run: npm ci
        working-directory: web
      - name: Install functions
        run: npm ci
        working-directory: functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Smoke test
        run: bash scripts/predeploy-smoke.sh
        env:
          SMOKE_CHANNEL: ''
      - name: Smoke log
        if: failure()
        run: tail -n 120 .predeploy-smoke.log

  regression:
    name: E2E regression (core flows, production build + emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install web
        run: npm ci
        working-directory: web
      - name: Install functions
        run: npm ci
        working-directory: functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Regression suite
        run: bash scripts/e2e-regression.sh
        env:
          SMOKE_CHANNEL: ''
      - name: Regression log
        if: failure()
        run: tail -n 120 .e2e-regression.log
      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-traces
          path: web/test-results
          retention-days: 7

