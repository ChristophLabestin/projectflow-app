name: Desktop release

# Builds the ProjectFlow desktop app (desktop/) for macOS and Windows and publishes it as a GitHub Release.
# Trigger: push a tag `v<version>` matching desktop/package.json (e.g. `npm --prefix desktop version 0.1.0`, then
# `git tag v0.1.0 && git push origin v0.1.0`), or run manually. Releases in this repo are desktop releases only:
# the web app's download links point at /releases/latest/download/... and the auto-updater reads latest*.yml.
#
# Signing (optional, picked up automatically when the secrets exist):
#   macOS:   MAC_CSC_LINK (base64 Developer ID Application .p12), MAC_CSC_KEY_PASSWORD,
#            APPLE_API_KEY (contents of the App Store Connect .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER → notarized.
#   Windows: either Azure Trusted Signing (recommended; OV/EV certificates are HSM-only since 2023, so a .pfx
#            for CI is rarely available): secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and
#            repository variables AZURE_SIGN_ENDPOINT (e.g. https://weu.codesigning.azure.net),
#            AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE, WIN_PUBLISHER_NAME (certificate subject CN)
#            — or WIN_CSC_LINK (base64 .pfx) + WIN_CSC_KEY_PASSWORD.
# Without them the builds are unsigned (macOS Gatekeeper blocks a double-click; Windows shows SmartScreen).

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read version
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v$VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match desktop/package.json version $VERSION" >&2
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # On a tag push the tag already exists: `--target <sha>` for an existing tag returns
          # HTTP 403 "Resource not accessible by integration" with GITHUB_TOKEN, so use --verify-tag.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TARGET=(--verify-tag)
          else
            TARGET=(--target "${GITHUB_SHA}")
          fi
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --draft --title "ProjectFlow Desktop $VERSION" \
              --notes "ProjectFlow Desktop $VERSION for macOS and Windows." "${TARGET[@]}"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Build shell
        run: npm run build
      - name: Package and upload (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          EXTRA=()
          if [[ -n "$CSC_LINK" ]]; then
            # Import into our own keychain: electron-builder's temporary keychain fails to unlock on
            # the macos-26 runner image (SecKeychainUnlock "passphrase not correct").
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
            echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -f pkcs12 -P "$CSC_KEY_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productsign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/signing.p12"
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_KEYCHAIN="$KEYCHAIN"
            export CSC_NAME="Christoph Labestin (48BM67TY9G)"
            # Sign the DMG itself too (electron-builder only signs the .app by default).
            EXTRA+=(-c.extraMetadata.pfSigned=true -c.dmg.sign=true)
            if [[ -n "$APPLE_API_KEY_CONTENT" ]]; then
              echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
              EXTRA+=(-c.mac.notarize=true)
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::warning::macOS build is unsigned (no MAC_CSC_LINK secret)."
          fi
          npx electron-builder --mac --publish always -c.publish.releaseType=draft "${EXTRA[@]}"
          if [[ -n "${APPLE_API_KEY:-}" ]]; then
            # electron-builder notarizes the app inside, not the DMG: notarize + staple the DMG so it also
            # opens offline without a Gatekeeper lookup, then replace the uploaded file. The updater uses the
            # zip (latest-mac.yml), so the changed DMG checksum does not matter.
            xcrun notarytool submit release/ProjectFlow-mac.dmg --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple release/ProjectFlow-mac.dmg
            gh release upload "v${{ needs.prepare.outputs.version }}" release/ProjectFlow-mac.dmg --clobber --repo "${{ github.repository }}"
          fi
      - name: Package and upload (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
        run: |
          EXTRA=()
          if [[ -n "$AZURE_CLIENT_SECRET" && -n "$AZURE_SIGN_ENDPOINT" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            EXTRA+=(-c.win.azureSignOptions.endpoint="$AZURE_SIGN_ENDPOINT"
              -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGN_ACCOUNT"
              -c.win.azureSignOptions.certificateProfileName="$AZURE_SIGN_PROFILE"
              -c.win.azureSignOptions.publisherName="$WIN_PUBLISHER_NAME")
          elif [[ -z "$CSC_LINK" ]]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::warning::Windows build is unsigned (no Azure Trusted Signing / WIN_CSC_LINK)."
          fi
          npx electron-builder --win --publish always -c.publish.releaseType=draft "${EXTRA[@]}"

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --draft=false --latest
