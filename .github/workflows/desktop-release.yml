name: Desktop release

# Builds the ProjectFlow desktop app (desktop/) for macOS and Windows and publishes it as a GitHub Release.
# Trigger: push a tag `v<version>` matching desktop/package.json (e.g. `npm --prefix desktop version 0.1.0`, then
# `git tag v0.1.0 && git push origin v0.1.0`), or run manually. Releases in this repo are desktop releases only:
# the web app's download links point at /releases/latest/download/... and the auto-updater reads latest*.yml.
#
# Signing (optional, picked up automatically when the secrets exist):
#   macOS:   MAC_CSC_LINK (base64 Developer ID Application .p12), MAC_CSC_KEY_PASSWORD,
#            APPLE_API_KEY (contents of the App Store Connect .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER → notarized.
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD.
# Without them the builds are unsigned (macOS Gatekeeper blocks a double-click; Windows shows SmartScreen).

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read version
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v$VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match desktop/package.json version $VERSION" >&2
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --draft --title "ProjectFlow Desktop $VERSION" \
              --notes "ProjectFlow Desktop $VERSION for macOS and Windows." --target "${GITHUB_SHA}"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Build shell
        run: npm run build
      - name: Package and upload (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          EXTRA=()
          if [[ -n "$CSC_LINK" ]]; then
            EXTRA+=(-c.extraMetadata.pfSigned=true)
            if [[ -n "$APPLE_API_KEY_CONTENT" ]]; then
              echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
              EXTRA+=(-c.mac.notarize=true)
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::warning::macOS build is unsigned (no MAC_CSC_LINK secret)."
          fi
          npx electron-builder --mac --publish always -c.publish.releaseType=draft "${EXTRA[@]}"
      - name: Package and upload (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::warning::Windows build is unsigned (no WIN_CSC_LINK secret)."
          fi
          npx electron-builder --win --publish always -c.publish.releaseType=draft

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --draft=false --latest
